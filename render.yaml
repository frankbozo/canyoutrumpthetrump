services:
  - type: web
    name: canyoutrumpthetrump
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: REQUIRE_APPROVAL
        value: "true"
      # Paste your Neon (or other Postgres) connection string in the
      # Render dashboard after the first deploy.
      - key: DATABASE_URL
        sync: false
      - key: SITE_ORIGIN
        value: https://canyoutrumpthetrump.com
